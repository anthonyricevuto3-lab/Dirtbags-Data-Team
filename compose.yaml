services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dirtbags
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: dirtbags
    volumes:
      - player-development-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dirtbags -d dirtbags"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      dockerfile: Dockerfile.platform
    environment:
      DATABASE_URL: postgresql+psycopg://dirtbags:local-development-only@db:5432/dirtbags
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  player-development-db:
